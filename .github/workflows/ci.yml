# CI for the shared headers and modules (charter, specs/001): format, every header compiling on its
# own against the duckdb line the consumers build on, the OIDC core's own test, and its parsers under
# libFuzzer. No duckdb build: a sparse clone of the duckdb tree is all any of it needs. The line is
# the 2.0 line alone (`v2.0-cyanoptera`, what duckdb-acl and acl-otel pin) - the owner's decision of
# 2026-09-18 (spec 002); v1.5.5 is not a target here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DUCKDB_REF: v2.0-cyanoptera

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # duckdb's pinned formatter (scripts/format.py: clang_format==11.0.1), called by full path so no
      # runner binary can shadow it
      - name: Install duckdb's pinned clang-format
        run: |
          python3 -m venv /tmp/cf
          /tmp/cf/bin/pip install clang_format==11.0.1
      - name: clang-format check
        run: |
          files="$(find hooks contracts oidc keychain \( -name '*.hpp' -o -name '*.cpp' \) 2>/dev/null)"
          if [ -z "$files" ]; then echo "no sources yet"; exit 0; fi
          echo "$files" | xargs /tmp/cf/bin/clang-format --dry-run --Werror
      - name: yamllint
        run: |
          pip install yamllint
          yamllint .github/workflows

  headers:
    name: Headers compile (duckdb v2.0-cyanoptera)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Sparse clone of duckdb
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch "$DUCKDB_REF" \
            https://github.com/duckdb/duckdb /tmp/duckdb
          git -C /tmp/duckdb sparse-checkout set src/include third_party
      # .clang-format is a real copy (a symlink into a submodule dangles in a checkout without
      # submodules); this is where a drift from duckdb's shows up
      - name: .clang-format is duckdb's
        run: diff <(tail -n +2 .clang-format) /tmp/duckdb/.clang-format
      - name: Every header compiles on its own
        run: scripts/check_headers.sh /tmp/duckdb
      # the delivery queue, counters and gauges every contract is built on (spec 008), on their own
      - name: The hooks test
        run: scripts/test_hooks.sh /tmp/duckdb build/hooks-test

  oidc:
    name: OIDC core test (${{ matrix.os }}, tls=${{ matrix.tls }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        tls: ['0', '1']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Sparse clone of duckdb
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch "$DUCKDB_REF" \
            https://github.com/duckdb/duckdb /tmp/duckdb
          git -C /tmp/duckdb sparse-checkout set src/include third_party
      # the module, its test and the bundled third party from the tree - nothing of a built duckdb
      # tls=1 is the variant every consumer ships (spec 003: its gate once tested a macro nobody
      # defined, and only a TLS build shows that); the runner's OpenSSL - Homebrew's on macOS
      - name: The fake-IdP test
        env:
          OIDC_TLS: ${{ matrix.tls }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then export OPENSSL_ROOT="$(brew --prefix openssl@3)"; fi
          scripts/test_oidc.sh /tmp/duckdb build/oidc-test

  fuzz:
    name: Fuzz the OIDC parsers (clang, 60 s)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Sparse clone of duckdb
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch "$DUCKDB_REF" \
            https://github.com/duckdb/duckdb /tmp/duckdb
          git -C /tmp/duckdb sparse-checkout set src/include third_party
      # clang carries libFuzzer; the discovery, token and device parsers are a consumer's
      # pre-authentication network input
      - name: libFuzzer over the parsers
        run: CXX=clang++ FUZZ_SECONDS=60 scripts/fuzz_oidc.sh /tmp/duckdb build/oidc-fuzz

  keychain:
    name: Keychain module (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # spec 010: the real OS store on each platform - Linux's Secret Service is gnome-keyring on a
      # private session bus, macOS a throwaway keychain made the default, Windows the runner's
      # Credential Manager (MinGW's g++, which the runner carries)
      - name: Linux - gnome-keyring on a session bus, and no bus at all
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-1-0 gnome-keyring dbus-x11
          env -u DBUS_SESSION_BUS_ADDRESS KEYCHAIN_EXPECT_UNAVAILABLE=1 scripts/test_keychain.sh build/kc-none
          # then a locked collection: nothing handed out, and no hang (the unlock prompt has no display)
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            scripts/test_keychain.sh
            KEYCHAIN_STEP=store build/keychain-test/test_keychain
            dbus-send --session --print-reply --dest=org.freedesktop.secrets /org/freedesktop/secrets \
              org.freedesktop.Secret.Service.Lock array:objpath:/org/freedesktop/secrets/collection/login >/dev/null
            KEYCHAIN_STEP=load-locked build/keychain-test/test_keychain'
      - name: macOS - a throwaway default keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci ci.keychain
          security unlock-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security list-keychains -d user -s ci.keychain
          scripts/test_keychain.sh
          security delete-keychain ci.keychain
          # the default now names a deleted keychain: unavailable, said so - never the system's dialog
          KEYCHAIN_EXPECT_UNAVAILABLE=1 build/keychain-test/test_keychain
      - name: Windows - the Credential Manager
        if: runner.os == 'Windows'
        run: CXX=g++ scripts/test_keychain.sh
      # what Windows consumers build with: MSVC, warnings as errors on the module
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Windows - MSVC compiles and runs it
        if: runner.os == 'Windows'
        shell: cmd
        run: >
          cl /nologo /std:c++17 /EHsc /W4 /WX /DDUCKDB_EXT_COMMON_KEYCHAIN_NAMESPACE=ext_common /Ikeychain\include
          keychain\test\test_keychain.cpp keychain\src\keychain.cpp advapi32.lib /Fe:test_keychain_msvc.exe
          && test_keychain_msvc.exe
